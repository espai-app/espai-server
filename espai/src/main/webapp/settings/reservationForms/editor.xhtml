<?xml version='1.0' encoding='UTF-8' ?>
<ui:composition
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:p="http://primefaces.org/ui"
  template="/WEB-INF/layout/layout.xhtml"
  xmlns:h="http://xmlns.jcp.org/jsf/html">

  <ui:param name="title" 
            value="#{reservationFormEditorView.form.id == null ? 'Buchungsformular erstellen' : 'Buchungsformular bearbeiten'}" />

  <ui:define name="content">

    <h1><h:outputText value="#{title}" /></h1>
    <h:form>
      <p:card>

        <div class="ui-fluid">
          <div class="grid">
            <div class="field col-10">
              <p:outputLabel for="name" value="Name" />
              <p:inputText id="name" value="#{reservationFormEditorView.form.name}" />
              <h:message for="name" />
            </div>
            <div class="field col-2">
              <p:outputLabel for="active" value="Aktiv" />
              <p:toggleSwitch id="active" value="#{reservationFormEditorView.form.active}" />
              <h:message for="active" />
            </div>
          </div>
            
        </div>

        <div>
          <p:commandButton value="speichern" 
                           action="#{reservationFormEditorView.save}" />
        </div>

      </p:card>

      <p:card title="Felder"
              rendered="#{reservationFormEditorView.form.id != null}" 
              styleClass="mt-3">

        <div>
          <p:linkButton href="fieldEditor.xhtml"
                        icon="pi pi-plus"
                        value="Feld hinzufügen">
            <f:param name="reservationFormId" value="#{reservationFormEditorView.form.id}" />
          </p:linkButton>
        </div>
        
        <p:dataTable id="fieldTable"
                    value="#{reservationFormEditorView.formFieldList}"
                    var="f"
                    styleClass="mt-3">
        
          <p:column headerText="Beschriftung">
            <h:outputText value="#{f.label}" />
          </p:column>
          
          <p:column headerText="technischer Name">
            <h:outputText value="#{f.name}" />
          </p:column>
          
          <p:column headerText="Typ">
            <h:outputText value="#{f.fieldType}" />
          </p:column>
          
          <p:column headerText="Pflichtfeld">
            <h:outputText value="ja" rendered="#{f.required}"/>
            <h:outputText value="nein" rendered="#{not f.required}"/>
          </p:column>
          
          <p:column width="100px">
            <p:linkButton title="bearbeiten"
                          icon="pi pi-pencil"
                          styleClass="ui-button-flat rounded-button"
                          href="fieldEditor.xhtml">
              <f:param name="reservationFormFieldId" value="#{f.id}" />
            </p:linkButton>

            <p:commandButton title="löschen"
                             icon="pi pi-trash"
                             styleClass="ui-button-flat rounded-button ui-button-danger"
                             action="#{reservationFormEditorView.deleteField(f.id)}"
                             update="fieldTable">
              <p:confirm header="Löschen bestätigen" 
                         message="Möchten Sie dieses Feld wirklich löschen?" 
                         icon="pi pi-exclamation-triangle" />

            </p:commandButton>
          </p:column>
        </p:dataTable>
      </p:card>
      
      <p:confirmDialog global="true" 
                       showEffect="fade" 
                       hideEffect="fade" 
                       responsive="true" 
                       width="650">
        <p:commandButton value="abbrechen" 
                         type="button" 
                         styleClass="ui-confirmdialog-no ui-button-flat"/>
        <p:commandButton value="Ja, löschen" 
                         type="button" 
                         icon="pi pi-trash" styleClass="ui-confirmdialog-yes ui-button-danger" />
      </p:confirmDialog>

      <p:growl globalOnly="true" />
    </h:form>
  </ui:define>
</ui:composition>
