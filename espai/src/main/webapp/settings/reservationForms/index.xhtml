<?xml version='1.0' encoding='UTF-8' ?>
<ui:composition
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:p="http://primefaces.org/ui"
  template="/WEB-INF/layout/settings.xhtml"
  xmlns:h="http://xmlns.jcp.org/jsf/html">

  <ui:param name="title" value="Buchungsformulare verwalten" />

  <ui:define name="content">
    <h:form>
      <h1>Buchungsformulare verwalten</h1>

      <div class="mb-3 grid">
        <div class="col-9">
          <p:linkButton icon="pi pi-plus" 
                        value="neues Formular"
                        href="editor.xhtml" />
        </div>
        <div class="col-3 text-right">
          <p:outputLabel for="showInactive" value="zeige inaktive" styleClass="mr-2" />
          <p:toggleSwitch id="showInactive" 
                          value="#{reservationFormIndexView.showInactive}"
                          label="zeige inaktive"
                          styleClass="vertical-align-middle"
                          valueChangeListener="#{reservationFormIndexView.onActiveChange}">
            <p:ajax update="typeTable" />
          </p:toggleSwitch>
        </div>
      </div>

      <p:card>
        <p:dataTable id="typeTable" value="#{reservationFormIndexView.formList}" var="f">
          <p:autoUpdate />
          <p:column headerText="Name">
            <p:link href="editor.xhtml" value="#{f.name}" styleClass="#{t.active ? '' : 'not-public'}">
              <f:param name="reservationFormId" value="#{f.id}" />
            </p:link>
          </p:column>
        </p:dataTable>
      </p:card>
    </h:form>
  </ui:define>
</ui:composition>
