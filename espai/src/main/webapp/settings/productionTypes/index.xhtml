<?xml version='1.0' encoding='UTF-8' ?>
<ui:composition
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:p="http://primefaces.org/ui"
  template="/WEB-INF/layout/settings.xhtml"
  xmlns:h="http://xmlns.jcp.org/jsf/html">

  <ui:param name="title" value="Veranstaltungsformate verwalten" />

  <ui:define name="content">
    <h:form>
      <h1>Veranstaltungsformate</h1>

      <div class="grid mb-3">
        <div class="col-9">
          <p:linkButton icon="pi pi-plus" 
                        value="neues Format"
                        href="editor.xhtml" />
        </div>
        <div class="col-3 text-right">
          <p:outputLabel for="showInactive" value="zeige inaktive" styleClass="mr-2" />
          <p:toggleSwitch id="showInactive" 
                          value="#{productionTypeIndexView.showInactive}"
                          label="zeige inaktive"
                          styleClass="vertical-align-middle" 
                          valueChangeListener="#{productionTypeIndexView.onActiveChange}">
            <p:ajax update="typeTable" />
          </p:toggleSwitch>
        </div>
      </div>

      <p:card>
        <p:dataTable id="typeTable" value="#{productionTypeIndexView.typeList}" var="t">

          <p:autoUpdate />

          <p:column style="width: 70px;">
            <span class="material-symbols-rounded production-type-icon" style="background-color: \##{t.color}">#{t.icon}</span>
          </p:column>

          <p:column headerText="Name">
            <p:link value="#{t.name}" href="editor.xhtml" styleClass="#{t.active ? '' : 'not-public'}">
              <f:param name="productionTypeId" value="#{t.id}" />
            </p:link>
          </p:column>
        </p:dataTable>

        <p:confirmDialog global="true" 
                         showEffect="fade" 
                         hideEffect="fade" 
                         responsive="true" 
                         width="650">
          <p:commandButton value="abbrechen" 
                           type="button" 
                           styleClass="ui-confirmdialog-no ui-button-flat"/>
          <p:commandButton value="Ja, löschen" 
                           type="button" 
                           icon="pi pi-trash" styleClass="ui-confirmdialog-yes ui-button-danger" />
        </p:confirmDialog>
      </p:card>
    </h:form>
  </ui:define>
</ui:composition>
