<?xml version='1.0' encoding='UTF-8' ?>
<ui:composition
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:p="http://primefaces.org/ui"
  template="/WEB-INF/layout/settings.xhtml"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="jakarta.tags.core">

  <ui:param name="title" value="Benutzerkonto bearbeiten" />

  <ui:define name="content">
    <h1>
      <c:choose>
        <c:when test="#{userEditorView.apiUser.id != null}">API-Token #{userEditorView.apiUser.displayName} bearbeiten</c:when>
        <c:when test="#{userEditorView.guiUser.id != null}">#{userEditorView.guiUser.displayName} bearbeiten</c:when>
        <c:when test="#{userEditorView.apiUser != null}">Neuen API-Token erstellen</c:when>
        <c:otherwise>Neues Benutzerkonto erstellen</c:otherwise>
      </c:choose>
    </h1>

    <h:form>
      <div class="mb-3">
        <p:commandButton value="speichern" icon="pi pi-save" action="#{userEditorView.save}" />

          <p:commandButton value="Passwort zurücksetzen"
                           icon="pi pi-undo"
                           action="#{userEditorView.resetPassword}"
                           styleClass="ml-3 ui-button-outlined ui-button-secondary"
                           rendered="#{userEditorView.guiUser.id != null}"/>
          <p:commandButton value="löschen"
                           icon="pi pi-trash"
                           action="#{userEditorView.delete}"
                           styleClass="ml-3 ui-button-outlined ui-button-danger"
                           rendered="#{userEditorView.apiUser.id != null or userEditorView.guiUser.id != null}">
            <p:confirm header="Löschen bestätigen" message="Möchten Sie dieses Benutzerkonto wirklich löschen?" />
          </p:commandButton>
      </div>

      <p:card>
        <h:panelGroup rendered="#{userEditorView.apiUser != null}">
          <div class="ui-fluid md:col-6">
            <div class="field">
              <p:outputLabel for="apiDisplayName" value="Name" />
              <p:inputText id="apiDisplayName" value="#{userEditorView.apiUser.displayName}" />
              <h:message for="apiDisplayName" />
            </div>

            <div class="field">
              <p:outputLabel for="apiToken" value="API-Token" />
              <p:inputText id="apiToken" value="#{userEditorView.apiUser.apiToken}" readonly="true" />
              <h:message for="apiToken" />
            </div>
          </div>
        </h:panelGroup>

        <h:panelGroup rendered="#{userEditorView.guiUser != null}">
          <div class="ui-fluid md:col-6">
            <div class="field">
              <p:outputLabel for="guiDisplayName" value="Name" />
              <p:inputText id="guiDisplayName" value="#{userEditorView.guiUser.displayName}" />
              <h:message for="guiDisplayName" />
            </div>

            <div class="field">
              <p:outputLabel for="email" value="E-Mail" />
              <p:inputText id="email" value="#{userEditorView.guiUser.email}" />
              <h:message for="email" />
            </div>

            <div class="field">
              <p:outputLabel for="username" value="Benutzername" />
              <p:inputText id="username" value="#{userEditorView.guiUser.username}" />
              <h:message for="username" />
            </div>
          </div>
        </h:panelGroup>

        <h2>Zugriffsrechte</h2>

        <p:commandButton value="Zugriffsrecht hinzufügen" icon="pi pi-plus" action="#{userEditorView.addAccessRight}" />

        <p:dataTable value="#{userEditorView.accessRightList}"
                     var="a"
                     class="mt-4 ui-fluid"
                     rowKey="#{a.id}"
                     rowIndexVar="rightIndex">

          <p:autoUpdate />

          <p:column headerText="Rolle">
            <p:selectOneMenu id="role" value="#{a.role}" styleClass="block">
              <f:selectItems value="#{userEditorView.userRoleList}" var="r" itemValue="#{r}" itemLabel="#{r}" />
            </p:selectOneMenu>
          </p:column>
          <p:column headerText="Spielstätte">
            <p:selectOneMenu id="venue" value="#{a.venue}" styleClass="block" rendered="#{a.role != 'MANAGER'}">
              <f:selectItems value="#{userEditorView.venueList}" var="v" itemValue="#{v}" itemLabel="#{v.name}, #{v.city}" />
            </p:selectOneMenu>
          </p:column>
          <p:column width="50px" styleClass="text-right">
            <p:commandButton id="deleteRole" icon="pi pi-trash" styleClass="rounded-button ui-button-flat" action="#{userEditorView.removeAccessRight(rightIndex)}" update="@form" />
          </p:column>
        </p:dataTable>

        <p:confirmDialog global="true" showEffect="fade" hideEffect="fade" responsive="true" width="450">
          <p:commandButton value="Ja, Benutzerkonto löschen" type="button" styleClass="ui-confirmdialog-yes" />
          <p:commandButton value="Nein" type="button" styleClass="ui-confirmdialog-no ui-button-flat"/>
        </p:confirmDialog>
      </p:card>
    </h:form>

  </ui:define>
</ui:composition>
