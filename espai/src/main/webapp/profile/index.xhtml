<?xml version="1.0" encoding="UTF-8"?>

<ui:composition
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:p="http://primefaces.org/ui"
  template="/WEB-INF/layout/layout.xhtml"
  xmlns:h="http://xmlns.jcp.org/jsf/html">

  <ui:param name="title" value="Profil bearbeiten"/>

  <ui:define name="content">
    <div class="page-title">
      <h1><h:outputText value="#{title}" /></h1>
    </div>

    <p:card title="Persönliche Daten">
      <h:form>
        <div class="ui-fluid mb-3">
          <div class="field">
            <p:outputLabel for="displayName">Angezeigter Name</p:outputLabel>
            <p:inputText id="displayName" value="#{profileEditorView.user.displayName}" />
          </div>

          <div class="field">
            <p:outputLabel for="email">E-Mail</p:outputLabel>
            <p:inputText id="email" value="#{profileEditorView.user.email}" />
          </div>
        </div>

        <p:commandButton value="speichern"
                         icon="pi pi-save"
                         action="#{profileEditorView.saveUser}" />
      </h:form>
    </p:card>




  </ui:define>
 </ui:composition>
