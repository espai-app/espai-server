<?xml version='1.0' encoding='UTF-8' ?>

<ui:composition
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:p="http://primefaces.org/ui"
  template="/WEB-INF/layout/seasons.xhtml"
  xmlns:h="http://xmlns.jcp.org/jsf/html">

  <ui:param name="title" value="Veranstaltungen programmieren"/>

  <ui:define name="content">
    <div class="page-title">
      <h1>Veranstaltungen programmieren</h1>
    </div>

    <h:panelGroup rendered="#{programmingView.error}">
      <p:staticMessage severity="error" summary="Filme und Spielstätten hinzufügen" detail="Um mit dem Programmieren beginnen zu können, fügen Sie Ihrer Spielzeit bitte Filme und Spielstätten hinzu." style="width: 100%"/>
    </h:panelGroup>

    <p:card rendered="#{not programmingView.error}">
      <h:form>
        <f:passThroughAttribute name="autocomplete" value="off" />

        <div class="field">
          <p:outputLabel for="venueId" value="Spielstätte" class="block" />
          <p:selectOneMenu id="venueId" value="#{programmingView.currentVenue}">
            <f:selectItems value="#{programmingView.venueList}" var="venue" itemValue="#{venue}" itemLabel="#{venue.name}, #{venue.city}" />
            <p:ajax event="valueChange" listener="#{programmingView.onVenueChange}" update="@form" />
            <f:converter binding="#{venueConverter}" />
          </p:selectOneMenu>
        </div>

        <p:dataTable id="events"
                     value="#{programmingView.eventList}"
                     var="e"
                     class="mt-4 mb-4 ui-fluid"
                     rowKey="#{p.id}"
                     rowIndexVar="rowIndex">

          <p:autoUpdate />

          <p:column headerText="Datum" style="width: 10%">
            <p:inputMask id="date" value="#{e.date}" mask="99.99.9999" label="Datum">
              <f:convertDateTime type="localDate" pattern="dd.MM.yyyy" />
            </p:inputMask>
            <h:message for="date" />
          </p:column>

          <p:column headerText="Beginn" style="width: 5%">
            <p:inputMask id="time" value="#{e.time}" mask="99:99" label="Zeit">
              <f:convertDateTime type="localTime" pattern="HH:mm" />
            </p:inputMask>
            <h:message for="time" />
          </p:column>

          <p:column headerText="Veranstaltung">
            <p:selectOneMenu id="productionVersion" value="#{e.production}" class="block" label="Veranstaltung">
              <f:selectItems value="#{programmingView.productionVersionList}"
                             var="p"
                             itemValue="#{p}"
                             itemLabel="#{p.production.title}#{p.versionName != '' ? ' ('.concat(p.versionName).concat(')') : ''}">
              </f:selectItems>
              <f:converter binding="#{productionVersionConverter}" />
            </p:selectOneMenu>
            <h:message for="productionVersion" />
          </p:column>

          <p:column headerText="Saal" style="width: 15%">
            <p:selectOneMenu id="hall" value="#{e.hall}" class="block">
              <f:selectItems value="#{programmingView.hallList}" var="hall" itemValue="#{hall}" itemLabel="#{hall.name} (#{hall.capacity} Pers.)" />
              <f:converter binding="#{hallConverter}" />
            </p:selectOneMenu>
            <h:message for="hall" />
          </p:column>

          <p:column headerText="Status" style="width: 10rem">
            <p:selectOneMenu id="eventStatus" value="#{e.status}" class="block">
              <f:selectItem itemValue="NORMAL" itemLabel="findet statt" />
              <f:selectItem itemValue="REQUESTED" itemLabel="angefragt" />
              <f:selectItem itemValue="POSTPONED" itemLabel="verschoben" />
              <f:selectItem itemValue="CANCELED" itemLabel="fällt aus" />
              <f:selectItem itemValue="POSTPONED" itemLabel="verschoben" />
              <f:selectItem itemValue="VENUE_CHANGED" itemLabel="anderer Ort" />
            </p:selectOneMenu>
            <h:message for="eventStatus" />
          </p:column>

          <p:column style="width: 30px; text-align: center">
            <p:commandButton id="deleteEvents"
                             icon="pi pi-trash"
                             styleClass="rounded-button ui-button-flat"
                             action="#{programmingView.deleteEvent(rowIndex)}"
                             immediate="true"
                             update="@form" />
          </p:column>

        </p:dataTable>

        <div>
          <p:commandButton id="saveProgram"
                           icon="pi pi-save"
                           value="Programm speichern"
                           action="#{programmingView.save}"
                           styleClass="mb-3" />

          <p:commandButton id="addEvent"
                           icon="pi pi-plus"
                           value="Veranstaltung hinzufügen"
                           action="#{programmingView.addEvents(1)}"
                           immediate="true"
                           update="@form"
                           styleClass="ui-button-outlined ml-2 mb-3"/>

          <p:commandButton id="addTenEvent"
                           icon="pi pi-plus"
                           value="10 Veranstaltungen hinzufügen"
                           action="#{programmingView.addEvents(10)}"
                           update="@form"
                           immediate="true"
                           styleClass="ui-button-outlined ml-2 mr-3 mb-3"/>

          <p:selectBooleanCheckbox value="#{programmingView.keepDate}"
                                   itemLabel="Datum des letzten Eintrags kopieren"
                                   styleClass="mb-3" />
        </div>
      </h:form>
    </p:card>
  </ui:define>


</ui:composition>
