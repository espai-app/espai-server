<?xml version='1.0' encoding='UTF-8' ?>
<ui:composition
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:p="http://primefaces.org/ui"
  template="/WEB-INF/layout/seasons.xhtml"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="jakarta.tags.core">

  <ui:param name="title" value="#{seasonVenueDetailsView.seasonVenue.venue.name}" />

  <ui:define name="content">

    <h:form>
      <h1><h:outputText value="#{title}" /></h1>

      <div class="mb-3">
        <p:linkButton value="bearbeiten"
                      icon="pi pi-pencil"
                      href="editor.xhtml?seasonId=#{seasonVenueDetailsView.seasonVenue.season.id}&amp;seasonVenueId=#{seasonVenueDetailsView.seasonVenue.id}" />
      </div>

      <p:card>
        <div class="grid">
          <div class="col-12 md:col-6">
            <div>
              <h:outputText value="#{seasonVenueDetailsView.seasonVenue.venue.name}" /><br />
              <h:outputText value="#{seasonVenueDetailsView.seasonVenue.venue.address}" /><br />
              <h:outputText value="#{seasonVenueDetailsView.seasonVenue.venue.postcode}" />
              <h:outputText value=" #{seasonVenueDetailsView.seasonVenue.venue.city}" /><br /><br />

              <b>Telefon:</b> <h:outputText value=" #{seasonVenueDetailsView.seasonVenue.venue.phone}" /><br />
              <b>E-Mail:</b> <h:outputText value=" #{seasonVenueDetailsView.seasonVenue.venue.email}" /><br />
              <b>Website:</b> <h:outputText value=" #{seasonVenueDetailsView.seasonVenue.venue.website}" />
            </div>


            <div class="mt-3 mb-3">
              <p:chip label="Programmiert selbst"
                       styleClass="mr-2"
                       rendered="#{seasonVenueDetailsView.seasonVenue.selfProgramming}" />

              <p:chip label="akzeptiert Terminwünsche"
                       styleClass="mr-2"
                       rendered="#{seasonVenueDetailsView.seasonVenue.allowFreeBooking}" />
            </div>

            <div class="mt-2">
              <b>Hinweise (für Webseite)</b><br />
              <h:outputText value="#{seasonVenueDetailsView.seasonVenue.venue.publicNotes}"
                            escape="false" />
            </div>

            <div class="mt-2">
              <b>Hinweise in dieser Spielzeit (für Webseite)</b><br />
              <h:outputText value="#{seasonVenueDetailsView.seasonVenue.seasonNotes}"
                            escape="false" />
            </div>
          </div>

          <div class="col-12 md:col-6 text-right">
            <img src="#{request.contextPath}/webservice/attachments/first/fit/Venue/#{seasonVenueDetailsView.seasonVenue.venue.id}/Profilbild/300/200" />
          </div>
        </div>
      </p:card>

      <p:tabView styleClass="mt-3">
        <p:tab title="Programmauswahl">

          <div class="mb-3">
            <p:commandButton value="Auswahl anpassen"
                             icon="pi pi-plus"
                             onclick="PF('productionSelectDialog').show()" />

            <p:commandButton value="alle hinzufügen"
                             icon="pi pi-plus"
                             styleClass="ml-2 ui-button-secondary ui-button-outlined"
                             action="#{seasonVenueDetailsView.addAllProductions}" />
          </div>

          <p:dataTable value="#{seasonVenueDetailsView.selectedSeasonProductionList}"
                       var="p">

            <p:autoUpdate />

            <p:column width="50px">
              <img src="#{request.contextPath}/webservice/attachments/first/fit/production/#{p.id}/poster/50/70" />
            </p:column>
            <p:column headerText="Titel">
              <h:outputText value="#{p.title}" styleClass="text-lg"/>
              <h:outputText value="#{p.subtitle}"
                            styleClass="block mt-1"
                            rendered="#{p.subtitle != null and !p.subtitle.blank}" />
            </p:column>
            <p:column headerText="Laufzeit (min.)" width="7%">
              <h:outputText value="#{p.durationInMinutes}" />
            </p:column>
            <p:column headerText="Alters&#173;freigabe" width="7%">
              <h:outputText value="#{p.rating}"
                            styleClass="text-lg"/>
            </p:column>
            <p:column headerText="Alter&#173;sempfeh&#173;lung" width="7%">
              <h:outputText value="#{p.recommendedAge}"
                            styleClass="text-lg"/>
            </p:column>
          </p:dataTable>

        </p:tab>
      </p:tabView>

      <p:dialog widgetVar="productionSelectDialog"
                header="Programmauswahl"
                modal="true"
                responsive="true"
                resizable="true"
                blockScroll="true"
                width="80%"
                height="500px">

        <p:dataTable value="#{seasonVenueDetailsView.allSeasonProductionList}"
                     selection="#{seasonVenueDetailsView.selectedSeasonProductionList}"
                     var="p"
                     rowKey="#{p.id}"
                     rowSelector="none"
                     scrollable="true">

          <p:column selectionMode="multiple" style="width:16px;text-align:center"/>

          <p:column headerText="Titel">
            <h:outputText value="#{p.title}"/>
            <h:outputText value="#{p.subtitle}"
                          styleClass="block mt-1 text-sm"
                          rendered="#{p.subtitle != null and !p.subtitle.blank}" />
          </p:column>
          <p:column headerText="Laufzeit (min.)" width="7%">
            <h:outputText value="#{p.durationInMinutes}" />
          </p:column>
          <p:column headerText="Alters&#173;freigabe" width="7%">
            <h:outputText value="#{p.rating}" />
          </p:column>
          <p:column headerText="Alter&#173;sempfeh&#173;lung" width="7%">
            <h:outputText value="#{p.recommendedAge}" />
          </p:column>
        </p:dataTable>

        <f:facet name="footer">
          <div class="pt-2">
            <p:commandButton value="speichern"
                             icon="pi pi-save"
                             action="#{seasonVenueDetailsView.updateSelection()}"
                             onclick="PF('productionSelectDialog').hide()" />
          </div>

        </f:facet>
      </p:dialog>
    </h:form>
  </ui:define>
</ui:composition>
