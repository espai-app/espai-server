<?xml version='1.0' encoding='UTF-8' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      template="/WEB-INF/layout/dialog.xhtml">

  <ui:param name="title" value="Spielstätte bearbeiten" />

  <ui:define name="content">
    <h:form>
      <f:passThroughAttribute name="autocomplete" value="off" />

      <input type="hidden" name="seasonVenueId" value="#{param.seasonVenueId}" />

      <div class="ui-fluid">
        <div class="field">
          <p:outputLabel for="seasonNotes" value="Öffentliche Hinweise in der Spielzeit" />

          <p:textEditor id="seasonNotes"
                        value="#{seasonVenueEditorView.seasonVenue.seasonNotes}"
                        height="200"
                        secure="false"
                        styleClass="w-full">

            <f:facet name="toolbar">
              <span class="ql-formats">
                <button class="ql-bold"></button>
                <button class="ql-italic"></button>
                <button class="ql-underline"></button>
                <button class="ql-strike"></button>
              </span>

              <span class="ql-formats">
                <button class="ql-script" value="sub" />
                <button class="ql-script" value="super" />
              </span>

              <span class="ql-formats">
                <button class="ql-list" value="ordered" />
                <button class="ql-list" value="bullet" />
                <button class="ql-indent" value="-1" />
                <button class="ql-indent" value="+1" />
              </span>

              <span class="ql-formats">
                <button class="ql-link" />
              </span>
            </f:facet>
          </p:textEditor>

          <h:message for="seasonNotes" />
        </div>

        <div class="field">
          <p:selectBooleanCheckbox value="#{seasonVenueEditorView.seasonVenue.selfProgramming}"
                                   itemLabel="programmiert selbst" />
        </div>
      </div>

      <div class="dialog-footer">
        <p:commandButton action="#{seasonVenueEditorView.save}" value="speichern" icon="pi pi-save" />
      </div>
    </h:form>
  </ui:define>
</ui:composition>
