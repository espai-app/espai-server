<?xml version='1.0' encoding='UTF-8' ?>
<ui:composition
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:p="http://primefaces.org/ui"
  template="/WEB-INF/layout/layout.xhtml"
  xmlns:h="http://xmlns.jcp.org/jsf/html">

  <ui:param name="title" value="Lizenzgeber"/>

  <ui:define name="content">
    <h:form>
      <p:breadCrumb homeDisplay="text">
        <p:menuitem value="Stammdaten" url="../index.xhtml"/>
        <p:menuitem value="Lizenzgeber" disabled="true" />
      </p:breadCrumb>

      <h1>Lizenzgeber</h1>

      <div class="mb-3">
        <p:linkButton href="editor.xhtml" icon="pi pi-plus" value="neuer Lizenzgeber" />
      </div>

      <p:dataTable value="#{agencyIndexView.agencyList}" var="a">
        <p:column headerText="Name">
          <p:link value="#{a.name == null or a.name.blank ? '(ohne Name)' : a.name}" href="details.xhtml">
            <f:param name="agencyId" value="#{a.id}" />
          </p:link>
        </p:column>

      </p:dataTable>
    </h:form>
  </ui:define>
</ui:composition>
