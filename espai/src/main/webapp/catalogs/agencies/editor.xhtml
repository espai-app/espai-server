<?xml version='1.0' encoding='UTF-8' ?>
<ui:composition
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:p="http://primefaces.org/ui"
  template="/WEB-INF/layout/layout.xhtml"
  xmlns:h="http://xmlns.jcp.org/jsf/html">

  <ui:param name="title" value="#{agencyEditorView.agency.id == null ? 'Neuer Lizenzgeber' : agencyEditorView.agency.name}"/>

  <ui:define name="content">
    <h1><h:outputText value="#{title}" /></h1>

    <h:form>
      <p:card>
        <div class="ui-fluid">
          <div class="field">
            <p:outputLabel for="name" value="Name" />
            <p:inputText id="name" value="#{agencyEditorView.agency.name}" />
            <h:message for="name" />
          </div>
        </div>

        <div>
          <p:commandButton icon="pi pi-save"
                           value="speichern"
                           action="#{agencyEditorView.save}"
                           update="@form" />
          <p:link value="abbrechen"
                  href="details.xhtml"
                  styleClass="ml-2"
                  rendered="#{agencyEditorView.agency.id != null}">
            <f:param name="agencyId" value="#{agencyEditorView.agency.id}" />
          </p:link>
          
          <p:link value="abbrechen"
                  href="index.xhtml"
                  styleClass="ml-2"
                  rendered="#{agencyEditorView.agency.id == null}" />
        </div>
      </p:card>
    </h:form>
  </ui:define>
</ui:composition>
