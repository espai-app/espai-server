<?xml version='1.0' encoding='UTF-8' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      template="/WEB-INF/layout/dialog.xhtml">

  <ui:param name="title" value="#{venueEditorView.venue.id == null ? 'Neue Spielstätte erstellen' : 'Spielstätte bearbeiten'}" />

  <ui:define name="content">
    <h:form>
      <f:passThroughAttribute name="autocomplete" value="off" />

      <input type="hidden" name="venueId" value="#{venueEditorView.venue.id}" />

      <div class="ui-fluid">
        <div class="field">
          <p:outputLabel for="name" value="Name" />
          <p:inputText id="name" value="#{venueEditorView.venue.name}" />
          <h:message for="name" />
        </div>

        <div class="field">
          <p:outputLabel for="slug" value="Slug" />
          <p:inputText id="slug" value="#{venueEditorView.venue.slug}" />
          <h:message for="slug" />
        </div>

        <div class="field">
          <p:outputLabel for="address" value="Adresse" />
          <p:inputText id="address" value="#{venueEditorView.venue.address}" />
          <h:message for="address" />
        </div>

        <div class="grid">
          <div class="field lg:col-2 col-4">
            <p:outputLabel for="postcode" value="PLZ" />
            <p:inputText id="postcode" value="#{venueEditorView.venue.postcode}" />
            <h:message for="postcode" />
          </div>

          <div class="field lg:col-10 col-8">
            <p:outputLabel for="city" value="Ort" />
            <p:inputText id="city" value="#{venueEditorView.venue.city}" />
            <h:message for="city" />
          </div>
        </div>

        <div class="field">
          <p:outputLabel for="phone" value="Telefon" />
          <p:inputText id="phone" value="#{venueEditorView.venue.phone}" />
          <h:message for="phone" />
        </div>

        <div class="field">
          <p:outputLabel for="email" value="E-Mail" />
          <p:inputText type="email" id="email" value="#{venueEditorView.venue.email}" />
          <h:message for="email" />
        </div>

        <div class="field">
          <p:outputLabel for="website" value="Webseite" />
          <p:inputText type="website" id="website" value="#{venueEditorView.venue.website}" />
          <h:message for="website" />
        </div>

        <div class="field">
          <p:outputLabel for="publicNotes" value="Freitext (Webseite)" />

          <p:textEditor id="publicNotes"
                        value="#{venueEditorView.venue.publicNotes}"
                        height="200"
                        secure="false"
                        styleClass="w-full">

            <f:facet name="toolbar">
              <span class="ql-formats">
                <button class="ql-bold"></button>
                <button class="ql-italic"></button>
                <button class="ql-underline"></button>
                <button class="ql-strike"></button>
              </span>

              <span class="ql-formats">
                <button class="ql-script" value="sub" />
                <button class="ql-script" value="super" />
              </span>

              <span class="ql-formats">
                <button class="ql-list" value="ordered" />
                <button class="ql-list" value="bullet" />
                <button class="ql-indent" value="-1" />
                <button class="ql-indent" value="+1" />
              </span>

              <span class="ql-formats">
                <button class="ql-link" />
              </span>
            </f:facet>
          </p:textEditor>

          <h:message for="publicNotes" />
        </div>
      </div>

      <div class="dialog-footer">
        <p:commandButton action="#{venueEditorView.save}" value="speichern" icon="pi pi-save" />
      </div>
    </h:form>
  </ui:define>
</ui:composition>
