<?xml version="1.0" encoding="UTF-8"?>

<ui:composition
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:p="http://primefaces.org/ui"
  template="/WEB-INF/layout/seasons.xhtml"
  xmlns:h="http://xmlns.jcp.org/jsf/html">

  <ui:define name="content">
    
    
    <div class="flex justify-content-between align-items-center flex-wrap">
      <h1>Einstellungen</h1>
      
      <div>
        <p:commandButton icon="pi pi-eye"
                         value="öffentlich"
                         class="ui-button-outlined"
                         action="#{seasonSettingsView.toggleArchive}" 
                         rendered="${not seasonSettingsView.currentSeason.archived}" />
        
        <p:commandButton icon="pi pi-eye-slash"
                         value="archiviert"
                         class="ui-button-outlined"
                         action="#{seasonSettingsView.toggleArchive}" 
                         rendered="${seasonSettingsView.currentSeason.archived}" />
        
        <p:commandButton icon="pi pi-trash"
                         value="löschen"
                         class="ui-button-outlined ui-button-danger ml-2"
                         action="#{seasonSettingsView.deleteSeason}"
                         rendered="${not userContext.restricted}">
        
          <p:confirm header="Löschen bestätigen" 
                     message="Möchten Sie die Spielzeit '${seasonSettingsView.currentSeason.name}' wirklich löschen? Alle Veranstaltungen und alle Buchungen gehen dabei verloren." />
        </p:commandButton>
      </div>
    </div>
    
    <p:card>
      <f:facet name="header">
        <p:tabMenu activeIndex="#{activeTab}">
          <p:menuitem url="index.xhtml" value="Allgemein">
            <f:param name="seasonId" value="#{param.seasonId}" />
          </p:menuitem>
          <p:menuitem url="mail.xhtml" value="E-Mail">
            <f:param name="seasonId" value="#{param.seasonId}" />
          </p:menuitem>
          <p:menuitem url="eventSerials.xhtml" value="Veranstaltungsreihen">
            <f:param name="seasonId" value="#{param.seasonId}" />
          </p:menuitem>
        </p:tabMenu>
      </f:facet>


      <ui:insert name="tab-content" />
    </p:card>
    
    <p:confirmDialog global="true" showEffect="fade" hideEffect="fade" responsive="true" width="650">
        <p:commandButton value="abbrechen" type="button" styleClass="ui-confirmdialog-no ui-button-flat"/>
        <p:commandButton value="Ja, löschen" type="button" icon="pi pi-trash" styleClass="ui-confirmdialog-yes ui-button-danger" />
      </p:confirmDialog>
  </ui:define>
</ui:composition>
