<?xml version="1.0" encoding="UTF-8"?>

<ui:composition
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:p="http://primefaces.org/ui"
  template="/WEB-INF/layout/layout.xhtml"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:c="jakarta.tags.core">

  <ui:define name="submenu">
    <h:form>
      <p:menubar autoDisplay="false">
        <p:submenu label="#{seasonView.selectedSeason.name}">
          <c:forEach items="#{seasonView.activeSeasons}" var="season">
            <p:menuitem value="#{season.name}" url="#{request.contextPath}/seasons/events/index.xhtml">
              <f:param name="seasonId" value="#{season.id}" />
            </p:menuitem>
          </c:forEach>
        </p:submenu>
        <p:menuitem value="Veranstaltungen" outcome="/seasons/events/index.xhtml">
          <f:param name="seasonId" value="#{seasonView.selectedSeason.id}" />
        </p:menuitem>
        <p:menuitem value="Spielstätten" outcome="/seasons/venues/index.xhtml">
          <f:param name="seasonId" value="#{seasonView.selectedSeason.id}" />
        </p:menuitem>
        <p:menuitem value="Programmauswahl" outcome="/seasons/movies/index.xhtml">
          <f:param name="seasonId" value="#{seasonView.selectedSeason.id}" />
        </p:menuitem>
        <p:menuitem value="Buchungen" outcome="/seasons/reservations/index.xhtml">
          <f:param name="seasonId" value="#{seasonView.selectedSeason.id}" />
        </p:menuitem>
        <p:menuitem value="Statistik" outcome="/seasons/analytics/index.xhtml">
          <f:param name="seasonId" value="#{seasonView.selectedSeason.id}" />
        </p:menuitem>
        <p:menuitem value="Einstellungen" outcome="/seasons/settings/index.xhtml">
          <f:param name="seasonId" value="#{seasonView.selectedSeason.id}" />
        </p:menuitem>
      </p:menubar>
    </h:form>
  </ui:define>
</ui:composition>
